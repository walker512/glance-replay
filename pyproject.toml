[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "glance-replay"
version = "0.1.0"
description = "Synthetic smart-glasses notification application replay"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "walker512"}]
[project.scripts]
glance-replay = "glance_replay.__main__:main"
[tool.setuptools.packages.find]
include = ["glance_replay*"]
